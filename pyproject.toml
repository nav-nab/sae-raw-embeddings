[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-raw"
version = "1.0.0"
description = "Can a sparse autoencoder recover GPT-2's raw token embeddings? Code and results for the paper."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "huggingface_hub",
    "safetensors",
    "tokenizers",
    "pyarrow",
]

[project.optional-dependencies]
# Training and analysis (all experiments).
train = ["torch", "scipy"]
# Figures for the paper.
paper = ["matplotlib", "pandas", "scipy"]
dev = ["pytest"]

[tool.setuptools]
packages = ["sae_raw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
